#: Fonts {{{
font_family      family="JetBrains Mono NL"
bold_font        auto
italic_font      auto
bold_italic_font auto

# Chinese
symbol_map U+4E00-U+9FFF LXGW WenKai Mono
# Nerd Font icons
symbol_map U+E000-U+F8FF Maple Mono NF CN

modify_font underline_position 2
modify_font underline_thickness 50%
modify_font strikethrough_thickness 200%
modify_font strikethrough_position 2px

#: }}}

#: Window layout {{{
remember_window_size  no
initial_window_width  1024
initial_window_height 768

enabled_layouts fat:bias=50,stack

placement_strategy top-left

# top, right, bottom left
window_padding_width 0 18 18 8
#: }}}

#: Mouse {{{
mouse_hide_wait 1.0
#: }}}

#: Text cursor customization {{{
# cursor none
cursor_shape block
cursor_blink_interval 0
cursor_trail 1
cursor_trail_decay 0.2 0.6
cursor_trail_start_threshold 0
#: }}}

#: THEME {{{
# One Dark
include current-theme.conf
#: }}}